[server]
bind = "127.0.0.1:8765"

[storage]
dir = "projects"            # one <project>.json file per project
# project = "default"       # open this project instead of the one used last time

# Any value can also be set through the environment, e.g. SHL_MQTT__ENABLED=true.
# Secrets belong in config.local.toml (git-ignored) or in the environment, not in this file.
[mqtt]
enabled = false
host = "127.0.0.1"
port = 1883
# client_id = "smart-home-lab"   # generated on every start when not set
# username = "lab"               # password: SHL_MQTT__PASSWORD or config.local.toml
discovery_prefix = "homeassistant"
base_topic = "smarthomelab"
remove_on_exit = true          # take the entities out of Home Assistant when the lab stops
